name: Bug report
description: Something in DustBuster does not work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please fill in the fields below so the problem can be reproduced.
  - type: input
    id: version
    attributes:
      label: DustBuster version
      description: Shown in the About window.
      placeholder: "1.4.0 (25)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: "macOS 15.6, MacBook Air (M2) / iMac 2019 (Intel)"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install DustBuster?
      options:
        - Downloaded the .dmg from Releases
        - Built from source
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or exported reports
      description: The exported .txt report or JSON test case, screenshots, or the diagnostic log export from Settings (usernames and paths are already sanitized).
